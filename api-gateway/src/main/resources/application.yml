server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**,/api/booking/**,/api/user/**
        - id: hotel-service-public
          uri: lb://hotel-service
          predicates:
            - Path=/api/hotels/**,/api/rooms,/api/rooms/recommend

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

